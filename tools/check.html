<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReadStep 책 검사</title>
<link rel="stylesheet" href="../css/app.css">
<style>
.wrap{padding-top:28px;padding-bottom:60px}
h1{font-size:30px;margin-bottom:6px}
h2{font-size:20px;margin:28px 0 10px}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.sum span{font-weight:800;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:#fff}
.sum .bad{color:var(--retry);border-color:var(--retry);background:var(--retry-s)}
.sum .good{color:var(--ok);border-color:var(--ok);background:var(--ok-s)}
td.bad{color:var(--retry);font-weight:700}
td.good{color:var(--ok);font-weight:700}
li{margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>ReadStep 책 검사</h1>
<p class="mut">data/books.js 와 data/pictures.js 를 읽어 검사합니다. 책을 추가하거나 고친 뒤 이 페이지를 새로 고치세요. <a href="../dev/" style="color:var(--blue-d);font-weight:700">개발 현황판으로</a></p>
<div id="out"><p>검사 중...</p></div>
</div>
<script src="../data/pictures.js"></script>
<script src="../data/books.js"></script>
<script src="../js/chunk.js"></script>
<script src="../data/words-ko.js"></script>
<script src="../data/chunks-ko.js"></script>
<script src="../js/check.js"></script>
<script>
(()=>{
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const out=document.getElementById('out'),r=window.RS_CHECK(window.RS_DATA);window.__check=r;
if(r.fatal){out.innerHTML='<p class="msg no">'+esc(r.errors[0])+'</p>';return}
const {errors,warnings,rows,pos,byStep}=r,BOOKS={length:r.books};
out.innerHTML=`<div class="sum"><span>책 ${BOOKS.length}권</span><span>퀴즈 ${window.__check.quiz}문항</span><span>그림 ${window.__check.pictures}종</span><span>낱말 풀이 ${window.__check.glossary}개</span><span class="${errors.length?'bad':'good'}">오류 ${errors.length}건</span><span class="${warnings.length?'bad':'good'}">확인할 점 ${warnings.length}건</span></div>
${errors.length?`<h2>오류 (반드시 고칠 것)</h2><ul>${errors.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul>`:''}
${warnings.length?`<h2>확인할 점</h2><ul>${warnings.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul>`:''}
<h2>단계별 책 수</h2><div class="card tablebox"><table><thead><tr>${byStep.map(s=>`<th scope="col">${s.n}단계 ${esc(s.name)}</th>`).join('')}</tr></thead><tbody><tr>${byStep.map(s=>`<td>${s.books}권</td>`).join('')}</tr></tbody></table></div>
<h2>책별 수치</h2><div class="card tablebox"><table><thead><tr><th scope="col">책</th><th scope="col">단계</th><th scope="col">쪽 수</th><th scope="col">낱말 수</th><th scope="col">기준</th><th scope="col">판정</th><th scope="col">가장 긴 쪽</th><th scope="col">낱말 풀이</th></tr></thead><tbody>
${rows.map(r=>`<tr><td lang="en">${esc(r.title)}<br><span class="mut" style="font-size:12px">${esc(r.id)}</span></td><td>${r.step}</td><td class="${r.pgOk?'':'bad'}">${r.pages}</td><td>${r.words}</td><td>${r.range}</td><td class="${r.inRange?'good':'bad'}">${r.inRange?'범위 안':'범위 밖'}</td><td>${r.longest}낱말</td><td>${r.gloss}%</td></tr>`).join('')}</tbody></table></div>
<h2>정답 위치</h2><p class="mut">인쇄용 문제지 기준 정답 위치: 1번 ${pos[0]}개, 2번 ${pos[1]}개, 3번 ${pos[2]}개. 화면 퀴즈는 풀 때마다 보기 순서를 섞습니다.</p>`;
})();
</script>
</body>
</html>
